<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Open Sans', Arial, sans-serif;
            background-color: #1e2229;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #f4f5f8;
            width: 900px;
            max-width: 95%;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
	    zoom: 0.9;
        }

        .header {
            text-align: center;
            padding: 40px 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header-logo {
            font-size: 20px;
            font-weight: 700;
            color: #333333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-logo svg {
            width: 20px;
            height: 20px;
        }

        .content {
            padding: 20px 40px 0;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            color: #333333;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        p {
            font-size: 14px;
            color: #666666;
            margin: 5px 0;
        }

        .illustration {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
        }

        .footer {
            border-top: 1px solid #EEEEEE;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 13px;
            color: #888888;
        }

        .footer-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .social-icons {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 1px solid #DDDDDD;
            border-radius: 50%;
            color: #AAAAAA;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-icons a:hover {
            border-color: #666666;
            color: #666666;
        }

        .social-icons svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        
        /* SVG Animation */
        .float-left { animation: floatLeft 3s ease-in-out infinite; }
        .float-right { animation: floatRight 3s ease-in-out infinite; }
        .pulse { animation: pulseAnim 2s infinite; }
        
        @keyframes floatLeft {
            0%, 100% { transform: translateX(30px); }
            50% { transform: translateX(-50px); }
        }
        
        @keyframes floatRight {
            0%, 100% { transform: translateX(0px); }
            50% { transform: translateX(50px); }
        }
        
        @keyframes pulseAnim {
            0%, 100% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 28px; }
            .footer { flex-direction: column; text-align: center; }
            .footer-info { flex-direction: column; gap: 8px; }
            .social-icons { margin-left: 0; }
        }
.icons{
  position: relative;
  width: 40px;
  height: 40px;
  z-index: 1; 
  filter: brightness(1);
  right: 10px;
  opacity: 1; 
}
    </style>
